<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>FinansFamília</title>
<meta name="description" content="Assistente financeiro da família — despesas, orçamento, dashboard e conciliação bancária.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<!-- iOS: instalar na tela de início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FinansFamília">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --goodtext:#006300;
    --accent:#2a78d6; --accent-soft:#e6eefb;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      --goodtext:#0ca30c; --accent:#3987e5; --accent-soft:#16304f;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--plane);color:var(--ink);overscroll-behavior-y:none}

  #app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding:calc(10px + var(--sat)) 16px calc(96px + var(--sab))}
  @media(min-width:980px){ #app{max-width:1080px;padding-top:20px} }

  .apphead{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 4px;gap:10px}
  .apphead .t{font-size:23px;font-weight:800;letter-spacing:-.03em}
  .avatars{display:flex;cursor:pointer}
  .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border:2px solid var(--plane)}
  .av+.av{margin-left:-8px}
  .chips{display:flex;gap:8px;padding:10px 0 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);font:600 12.5px/1 system-ui;padding:9px 14px;border-radius:99px;cursor:pointer}
  .chip.on{background:var(--ink);color:var(--plane);border-color:var(--ink)}
  .monthnav{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .monthnav button{border:1px solid var(--ring);background:var(--surface);color:var(--ink2);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:13px}
  .monthnav .m{font:700 13px system-ui;min-width:86px;text-align:center}

  .card{background:var(--surface);border:1px solid var(--ring);border-radius:18px;padding:16px;margin-top:12px}
  .card h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h3 .more{color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .hero-label{font-size:13px;color:var(--ink2)}
  .hero{font-size:38px;font-weight:700;letter-spacing:-.03em;margin:2px 0 4px}
  .delta{font-size:13px;font-weight:600}
  .delta.up{color:var(--goodtext)} .delta.down{color:var(--crit)} .delta.na{color:var(--muted)}
  .duo{display:flex;gap:12px;margin-top:12px}
  .duo .card{flex:1;margin-top:0}
  .mini-label{font-size:12px;color:var(--ink2)} .mini-val{font-size:19px;font-weight:700;margin-top:2px}

  .legend{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .lg{display:flex;align-items:center;gap:8px;font-size:13px}
  .lg .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .lg .nm{color:var(--ink);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .vl{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .lg .pc{color:var(--muted);font-size:12px;width:38px;text-align:right;font-variant-numeric:tabular-nums}

  .budget-row{margin-top:12px}
  .budget-row .bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
  .budget-row .bt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .budget-row .bt span{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .track{height:8px;border-radius:6px;background:var(--grid);overflow:hidden}
  .fill{height:100%;border-radius:6px}

  .txrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--grid);cursor:pointer}
  .txrow:last-child{border-bottom:0}
  .txic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .txmain{flex:1;min-width:0}
  .txmain .d{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .txmain .s{font-size:12px;color:var(--muted);margin-top:1px}
  .txval{text-align:right}
  .txval .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .txval .v.in{color:var(--goodtext)}
  .txval .who{font-size:11px;color:var(--muted);margin-top:1px}
  .conc{font-size:10px;margin-left:4px}
  .daylbl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 0;text-transform:uppercase;letter-spacing:.04em}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:28px 16px;line-height:1.6}
  .empty .big{font-size:34px;margin-bottom:8px}

  .insight{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--ring);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13px}
  .insight .em{font-size:16px;line-height:1.2}

  .searchbar{display:flex;gap:8px;margin-top:10px}
  .searchbar input{flex:1;border:1px solid var(--ring);background:var(--surface);border-radius:12px;padding:11px 14px;font:400 14px system-ui;color:var(--ink);outline:none}

  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--ring);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:8px 8px calc(10px + var(--sab));z-index:40}
  .tabbar .inner{display:flex;align-items:flex-end;justify-content:space-around;width:100%;max-width:520px}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10px system-ui;color:var(--muted);cursor:pointer;width:64px;padding:0}
  .tab .ic{font-size:21px}
  .tab.on{color:var(--accent)}
  .fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:27px;line-height:1;cursor:pointer;box-shadow:0 6px 16px rgba(42,120,214,.4);margin-top:-26px}

  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
  .sheet-bg.open{display:block}
  .sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:520px;background:var(--surface);border-radius:26px 26px 0 0;padding:16px 18px calc(22px + var(--sab));z-index:51;transition:transform .28s cubic-bezier(.3,.9,.3,1);max-height:92vh;overflow-y:auto}
  .sheet.open{transform:translate(-50%,0)}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--grid);margin:0 auto 12px}
  .sheet h2{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2 .del{color:var(--crit);font-size:12.5px;font-weight:600;cursor:pointer}
  .amount{display:flex;align-items:baseline;gap:6px;justify-content:center;margin:2px 0 12px}
  .amount span{font-size:18px;color:var(--muted);font-weight:600}
  .amount input{border:0;background:none;font:700 36px/1.2 system-ui;color:var(--ink);width:190px;text-align:center;outline:none;letter-spacing:-.02em}
  .typeRow{display:flex;gap:8px;margin-bottom:12px}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .catbtn{border:1px solid var(--ring);background:var(--plane);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10.5px system-ui;color:var(--ink2);cursor:pointer;min-width:0}
  .catbtn span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .catbtn .e{font-size:19px}
  .catbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .optrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .opt{flex:1;min-width:90px;border:1px solid var(--ring);background:var(--plane);border-radius:12px;padding:10px 6px;font:600 12.5px system-ui;color:var(--ink2);cursor:pointer;text-align:center}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .frow{display:flex;gap:8px;margin-bottom:10px}
  .frow>*{flex:1}
  .finput,.fselect{width:100%;border:1px solid var(--ring);background:var(--plane);border-radius:12px;padding:11px 12px;font:500 13.5px system-ui;color:var(--ink);outline:none}
  .flabel{font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 2px 5px;text-transform:uppercase;letter-spacing:.04em}
  .save{width:100%;border:0;background:var(--accent);color:#fff;font:700 15px system-ui;padding:14px;border-radius:14px;cursor:pointer;margin-top:6px}
  .btn2{width:100%;border:1px solid var(--ring);background:var(--surface);color:var(--ink);font:600 13.5px system-ui;padding:12px;border-radius:12px;cursor:pointer;margin-top:8px}
  .btn2.danger{color:var(--crit);border-color:rgba(208,59,59,.4)}

  .toast{position:fixed;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--plane);font:600 13px system-ui;padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:99;white-space:nowrap;pointer-events:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* conciliação */
  .dropzone{border:1.5px dashed var(--baseline);border-radius:16px;padding:22px;text-align:center;color:var(--ink2);font-size:13px;margin-top:12px;background:var(--surface)}
  .dropzone .big{font-size:28px;margin-bottom:6px}
  .abtn{border:0;background:var(--accent);color:#fff;font:600 13px system-ui;padding:10px 18px;border-radius:11px;cursor:pointer;margin-top:10px}
  .pill{display:inline-flex;align-items:center;gap:5px;font:600 11px system-ui;padding:4px 9px;border-radius:99px;white-space:nowrap}
  .pill.ok{background:rgba(12,163,12,.13);color:var(--goodtext)}
  .pill.sg{background:rgba(250,178,25,.16);color:#8a6100}
  .pill.nw{background:var(--accent-soft);color:var(--accent)}
  .pill.dv{background:rgba(208,59,59,.12);color:var(--crit)}
  .mrow{padding:11px 0;border-bottom:1px solid var(--grid)}
  .mrow:last-child{border-bottom:0}
  .mrow .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mrow .desc{font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .val{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mrow .l2{display:flex;justify-content:space-between;align-items:center;margin-top:5px;gap:8px}
  .mrow .meta{font-size:11.5px;color:var(--muted);min-width:0}
  .mrow .act{border:1px solid var(--accent);background:none;color:var(--accent);font:600 11.5px system-ui;padding:5px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .mrow select{border:1px solid var(--ring);background:var(--plane);color:var(--ink);font:600 11.5px system-ui;border-radius:8px;padding:4px 6px;max-width:150px}
  .statline{display:flex;gap:8px;margin-top:12px}
  .statline .st{flex:1;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:10px 4px;text-align:center}
  .statline .st .n{font-size:20px;font-weight:800}
  .statline .st .l{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}

  .chart-legend{display:flex;gap:16px;margin:2px 0 8px}
  .chart-legend .lg{font-size:12px;color:var(--ink2)}
  .axislbl{font-size:10.5px;fill:var(--muted)}

  .setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--grid);font-size:14px}
  .setrow:last-child{border-bottom:0}
  .setrow .sl{font-weight:600}
  .setrow .sd{font-size:12px;color:var(--muted);margin-top:2px}
  .setrow input[type=text],.setrow input[type=number]{border:1px solid var(--ring);background:var(--plane);border-radius:10px;padding:8px 10px;font:500 13.5px system-ui;color:var(--ink);width:130px;text-align:right;outline:none}

  .memwarn{background:rgba(250,178,25,.14);border:1px solid rgba(250,178,25,.5);border-radius:12px;padding:10px 14px;font-size:12.5px;margin-top:10px;display:none}

  /* desktop dashboard grid */
  .grid{display:block}
  @media(min-width:980px){
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
    .grid>.card{margin-top:0}
    .gd3{grid-column:span 3}.gd4{grid-column:span 4}.gd5{grid-column:span 5}.gd6{grid-column:span 6}.gd7{grid-column:span 7}.gd12{grid-column:span 12}
    .grid>.duo{display:contents}
    .grid .insight{grid-column:span 12;margin-top:0}
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="app"></div>

<div class="tabbar"><div class="inner">
  <button class="tab on" data-s="home" onclick="go('home')"><span class="ic">🏠</span>Início</button>
  <button class="tab" data-s="tx" onclick="go('tx')"><span class="ic">🧾</span>Lançamentos</button>
  <button class="fab" onclick="openTxSheet()">+</button>
  <button class="tab" data-s="conc" onclick="go('conc')"><span class="ic">🏦</span>Extratos</button>
  <button class="tab" data-s="bud" onclick="go('bud')"><span class="ic">🎯</span>Orçamento</button>
</div></div>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="fileInput" accept=".ofx,.csv,.txt,.qfx" style="display:none">
<input type="file" id="restoreInput" accept=".json" style="display:none">

<script>
'use strict';
/* ============================================================
   FinansFamília — MVP (Fase 1)
   Dados 100% locais no dispositivo (localStorage), com backup
   e exportação. Nenhum dado sai do aparelho.
   ============================================================ */

/* ---------- armazenamento ---------- */
const DB_KEY='finansfamilia_v1';
let memoryOnly=false;
function defaultData(){
  return {
    v:1,
    people:[{id:'p1',n:'Pessoa 1',c:'#4a3aa7'},{id:'p2',n:'Pessoa 2',c:'#1baf7a'}],
    cats:[
      {id:'moradia',n:'Moradia',e:'🏠',c:'var(--s1)'},
      {id:'mercado',n:'Mercado',e:'🛒',c:'var(--s2)'},
      {id:'alifora',n:'Alim. fora',e:'🍽️',c:'var(--s3)'},
      {id:'transp',n:'Transporte',e:'🚗',c:'var(--s4)'},
      {id:'saude',n:'Saúde',e:'💊',c:'var(--s5)'},
      {id:'educ',n:'Educação',e:'📚',c:'var(--s6)'},
      {id:'lazer',n:'Lazer',e:'🎬',c:'var(--s7)'},
      {id:'assin',n:'Assinaturas',e:'📺',c:'var(--s8)'},
      {id:'vest',n:'Vestuário',e:'👕',c:'var(--s5)'},
      {id:'pets',n:'Pets',e:'🐶',c:'var(--s3)'},
      {id:'salario',n:'Salário',e:'💼',c:'var(--s6)',income:true},
      {id:'outros',n:'Outros',e:'📦',c:'var(--muted)'}
    ],
    budgets:{}, // catId -> valor mensal
    rules:[],   // {pattern, catId}
    txs:[],     // {id,date:'YYYY-MM-DD',desc,cat,v,type:'exp'|'inc',who,pay,conc,origin,hash,parcela}
    onboarded:false
  };
}
let D;
function load(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    D=raw?JSON.parse(raw):defaultData();
    if(!raw){localStorage.setItem(DB_KEY,JSON.stringify(D))}
  }catch(e){ memoryOnly=true; D=defaultData(); }
}
function save(){
  if(memoryOnly) return;
  try{localStorage.setItem(DB_KEY,JSON.stringify(D))}catch(e){memoryOnly=true;render()}
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const uid=()=> 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const cat=id=>D.cats.find(c=>c.id===id)||D.cats.find(c=>c.id==='outros');
const person=id=>D.people.find(p=>p.id===id)||D.people[0];
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtD(iso){return iso.slice(8,10)+'/'+iso.slice(5,7)}
function monthKey(iso){return iso.slice(0,7)}
function monthLabel(mk){const [y,m]=mk.split('-');return MESESF[+m-1]+' '+y}
function addMonths(mk,n){const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function parseMoney(s){
  s=String(s).trim().replace(/R\$\s*/i,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  const v=parseFloat(s); return isNaN(v)?null:v;
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2500)}
function cssVar(v){ if(!v||!v.startsWith('var(')) return v; return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim(); }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------- estado de navegação ---------- */
let screen='home', curMonth=monthKey(todayISO()), personFilter='all', txSearch='';
let pendingImport=null; // resultado da conciliação em andamento

/* ---------- consultas ---------- */
function txsOfMonth(mk, pf){
  return D.txs.filter(t=>monthKey(t.date)===mk && (pf==='all'||!pf?true:t.who===pf));
}
function totalsFor(mk, pf){
  const list=txsOfMonth(mk, pf||personFilter);
  let exp=0, inc=0; const byCat={};
  list.forEach(t=>{
    if(t.type==='inc'){inc+=t.v}
    else {exp+=t.v; byCat[t.cat]=(byCat[t.cat]||0)+t.v}
  });
  return {exp,inc,byCat,list:list.slice().sort((a,b)=>b.date.localeCompare(a.date))};
}

/* ---------- gráficos SVG ---------- */
function donutSVG(byCat,size){
  size=size||136;
  const entries=D.cats.map(c=>({...c,v:byCat[c.id]||0})).filter(c=>c.v>0);
  const total=entries.reduce((s,c)=>s+c.v,0);
  if(!total) return '<div class="empty" style="padding:14px"><div class="big">🍩</div>Sem despesas neste mês ainda.</div>';
  const r=size/2-9,cx=size/2,cy=size/2,sw=17;
  let a0=-Math.PI/2,paths='';
  entries.forEach(c=>{
    const frac=c.v/total;
    const a1=a0+frac*Math.PI*2*0.99999;
    const large=(a1-a0)>Math.PI?1:0;
    paths+=`<path d="M ${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A ${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}" fill="none" stroke="${cssVar(c.c)}" stroke-width="${sw}"><title>${esc(c.n)}: ${brl(c.v)}</title></path>`;
    a0=a0+frac*Math.PI*2;
  });
  let gaps='';a0=-Math.PI/2;
  if(entries.length>1) entries.forEach(c=>{
    gaps+=`<line x1="${cx+(r-sw/2-1)*Math.cos(a0)}" y1="${cy+(r-sw/2-1)*Math.sin(a0)}" x2="${cx+(r+sw/2+1)*Math.cos(a0)}" y2="${cy+(r+sw/2+1)*Math.sin(a0)}" stroke="${cssVar('var(--surface)')}" stroke-width="2.5"/>`;
    a0+=(c.v/total)*Math.PI*2;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Gastos por categoria">${paths}${gaps}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font:700 14px system-ui" fill="${cssVar('var(--ink)')}">${brl0(total)}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" style="font:500 10px system-ui" fill="${cssVar('var(--muted)')}">no mês</text></svg>`;
}
function evolutionSVG(w,h){
  w=w||520;h=h||190;
  const months=[];for(let i=5;i>=0;i--)months.push(addMonths(curMonth,-i));
  const data=months.map(mk=>{const t=totalsFor(mk,'all');return {m:MESES[+mk.split('-')[1]-1],r:t.inc,e:t.exp}});
  const maxV=Math.max(1000,...data.map(d=>Math.max(d.r,d.e)));
  const step=niceStep(maxV);
  const max=Math.ceil(maxV/step)*step;
  const pad={l:46,r:8,t:10,b:24};
  const iw=(w-pad.l-pad.r)/data.length;
  const bw=Math.min(22,(iw-14)/2);
  const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  const y0=y(0);
  let g='';
  for(let v=0;v<=max;v+=step){g+=`<line x1="${pad.l}" y1="${y(v)}" x2="${w-pad.r}" y2="${y(v)}" stroke="${cssVar('var(--grid)')}" stroke-width="1"/><text x="${pad.l-6}" y="${y(v)+3.5}" text-anchor="end" class="axislbl">${compact(v)}</text>`}
  let bars='';
  data.forEach((m,i)=>{
    const x0=pad.l+i*iw+iw/2;
    bars+=barPath(x0-bw-1.5,y(m.r),bw,y0-y(m.r),cssVar('var(--s1)'),`${m.m}: receitas ${brl0(m.r)}`);
    bars+=barPath(x0+1.5,y(m.e),bw,y0-y(m.e),cssVar('var(--s2)'),`${m.m}: despesas ${brl0(m.e)}`);
    bars+=`<text x="${x0}" y="${h-8}" text-anchor="middle" class="axislbl"${i===data.length-1?' style="font-weight:700"':''}>${m.m}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Receitas e despesas por mês">${g}${bars}
    <line x1="${pad.l}" y1="${y0}" x2="${w-pad.r}" y2="${y0}" stroke="${cssVar('var(--baseline)')}" stroke-width="1"/></svg>`;
}
function niceStep(max){const raw=max/3;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function compact(v){return v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(v)}
function barPath(x,y,w,h,fill,title){
  if(h<=0.5)return '';
  const r=Math.min(4,h);
  return `<path d="M ${x} ${y+h} L ${x} ${y+r} Q ${x} ${y} ${x+r} ${y} L ${x+w-r} ${y} Q ${x+w} ${y} ${x+w} ${y+r} L ${x+w} ${y+h} Z" fill="${fill}"><title>${esc(title)}</title></path>`;
}
function budgetBar(catId,spent){
  const c=cat(catId),lim=D.budgets[catId];
  if(!lim) return '';
  const p=spent/lim;
  const col=p>=1?'var(--crit)':(p>=.7?'var(--warn)':'var(--good)');
  return `<div class="budget-row">
    <div class="bt"><b>${c.e} ${esc(c.n)}</b><span>${brl0(spent)} / ${brl0(lim)} · ${Math.round(p*100)}%</span></div>
    <div class="track"><div class="fill" style="width:${Math.min(p*100,100)}%;background:${col}"></div></div></div>`;
}

function makeInsight(byCat){
  const msgs=[];
  Object.keys(D.budgets).forEach(id=>{
    const lim=D.budgets[id]; if(!lim) return;
    const p=(byCat[id]||0)/lim;
    if(p>=1) msgs.push(`🔴 <b>${esc(cat(id).n)}</b> estourou o orçamento (${Math.round(p*100)}%).`);
    else if(p>=.8) msgs.push(`⚠️ <b>${esc(cat(id).n)}</b> já usou ${Math.round(p*100)}% do orçamento.`);
  });
  // comparação com média de 3 meses
  const hist={};
  for(let i=1;i<=3;i++){const t=totalsFor(addMonths(curMonth,-i),'all');Object.keys(t.byCat).forEach(k=>hist[k]=(hist[k]||0)+t.byCat[k])}
  Object.keys(byCat).forEach(k=>{
    const avg=(hist[k]||0)/3;
    if(avg>100 && byCat[k]>avg*1.3) msgs.push(`📈 <b>${esc(cat(k).n)}</b> está ${Math.round((byCat[k]/avg-1)*100)}% acima da média dos últimos 3 meses.`);
  });
  if(!msgs.length) return '';
  return `<div class="insight"><span class="em">💡</span><span>${msgs.slice(0,2).join('<br>')}</span></div>`;
}

  $('sheet').innerHTML=`

    <div class="typeRow">
      <button class="opt ${selType==='exp'?'on':''}" onclick="selType='exp';openTxSheetRefresh()">💸 Despesa</button>
      <button class="opt ${selType==='inc'?'on':''}" onclick="selType='inc';openTxSheetRefresh()">💰 Receita</button></div>
    <div class="amount"><span>R$</span><input id="amt" type="text" inputmode="decimal" placeholder="0,00" value="${t?String(t.v.toFixed(2)).replace('.',','):''}"></div>
    <div class="catgrid">${D.cats.filter(c=>selType==='inc'?c.income||c.id==='outros':!c.income).map(c=>`<button class="catbtn ${selCat===c.id?'on':''}" onclick="selCat='${c.id}';markSel(this,'catbtn')"><span class="e">${c.e}</span><span class="lbl">${esc(c.n)}</span></button>`).join('')}</div>
    <div class="flabel">Descrição (opcional)</div>
    <input class="finput" id="descIn" type="text" placeholder="Ex.: Supermercado Extra" value="${t?esc(t.desc||''):''}" style="margin-bottom:10px">
    <div class="frow"><div><div class="flabel">Data</div><input class="finput" id="dateIn" type="date" value="${t?t.date:todayISO()}"></div>
      ${!t&&selType==='exp'?`<div><div class="flabel">Parcelas</div><select class="fselect" id="parcIn"><option value="1">à vista</option>${[2,3,4,5,6,10,12].map(n=>`<option value="${n}">${n}×</option>`).join('')}</select></div>`:''}</div>
    <div class="flabel">Quem ${selType==='inc'?'recebeu':'pagou'}</div>
    <div class="optrow">${D.people.map(p=>`<button class="opt ${selWho===p.id?'on':''}" onclick="selWho='${p.id}';markSel(this,'opt')">${esc(p.n)}</button>`).join('')}</div>
    <div class="flabel">Forma de pagamento</div>
    <div class="optrow" id="payRow">${pays.map(p=>`<button class="opt ${selPay===p?'on':''}" onclick="selPay='${p}';markSel(this,'opt')">${p}</button>`).join('')}</div>
    <button class="save" onclick="saveTx()">${t?'Salvar alterações':'Salvar'}</button>`;
  $('sheetBg').classList.add('open');$('sheet').classList.add('open');
  if(!t) setTimeout(()=>{try{$('amt').focus()}catch(e){}},280);
}
function openTxSheetRefresh(){const v=$('amt')?$('amt').value:'';const d=$('descIn')?$('descIn').value:'';const dt=$('dateIn')?$('dateIn').value:'';openTxSheet(editing?editing.id:undefined,true);if($('amt'))$('amt').value=v;if($('descIn'))$('descIn').value=d;if(dt&&$('dateIn'))$('dateIn').value=dt}
function markSel(el,cls){el.parentNode.querySelectorAll('.'+cls).forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function closeSheet(){$('sheetBg').classList.remove('open');$('sheet').classList.remove('open')}
function saveTx(){
  const v=parseMoney($('amt').value);
  if(!v||v<=0){toast('Digite um valor 🙂');return}
  const desc=$('descIn').value.trim();
  const date=$('dateIn').value||todayISO();
  if(editing){
    Object.assign(editing,{v,desc,date,cat:selCat,who:selWho,pay:selPay,type:selType});
    toast('✏️ Lançamento atualizado');
  } else {
    const parc=$('parcIn')?+$('parcIn').value:1;
    if(parc>1){
      const vp=Math.round(v/parc*100)/100;
      for(let i=0;i<parc;i++){
        const d=new Date(+date.slice(0,4),+date.slice(5,7)-1+i,+date.slice(8,10));
        const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        D.txs.push({id:uid(),date:iso,desc,cat:selCat,v:vp,type:selType,who:selWho,pay:selPay,conc:false,origin:'manual',parcela:(i+1)+'/'+parc});
      }
      toast(`✅ ${parc} parcelas de ${brl(vp)} lançadas`);
    } else {
      D.txs.push({id:uid(),date,desc,cat:selCat,v,type:selType,who:selWho,pay:selPay,conc:false,origin:'manual'});
      toast('✅ Lançado!');
    }
    if(monthKey(date)!==curMonth) curMonth=monthKey(date);
  }
  editing=null; save(); closeSheet(); render();
}
function deleteTx(){
  if(!editing) return;
  D.txs=D.txs.filter(t=>t.id!==editing.id);
  editing=null; save(); closeSheet(); render(); toast('🗑️ Excluído');
}

/* ---------- importação & conciliação ---------- */
const KEYWORDS=[
  {re:/mercado|supermerc|atacad|carrefour|extra|assai|hortifruti|sacol[aã]o|feira|acougue|açougue/i,cat:'mercado'},
  {re:/padaria|restaurante|lanche|pizza|ifood|rappi|burger|hamburg|cafe|café|bar\b|churrasc/i,cat:'alifora'},
  {re:/uber|99app|99\*|taxi|combust|gasolina|posto|ipiranga|shell|estacion|sem parar|conectcar|pedagio|ped[aá]gio|metro|onibus|[oô]nibus/i,cat:'transp'},
  {re:/farmacia|farm[aá]cia|drogaria|droga\s?raia|drogasil|pague\s?menos|hospital|clinica|cl[ií]nica|laborat|dentista|unimed|amil|hapvida/i,cat:'saude'},
  {re:/escola|coleg|faculdade|universid|curso|udemy|alura|livraria|papelaria/i,cat:'educ'},
  {re:/netflix|spotify|disney|hbo|max\b|prime\s?video|globoplay|youtube|deezer|icloud|google\s?one/i,cat:'assin'},
  {re:/cinema|cinemark|ingresso|show|teatro|steam|playstation|xbox|nintendo|viagem|hotel|airbnb|decolar/i,cat:'lazer'},
  {re:/aluguel|condominio|condom[ií]nio|energia|enel|light|cemig|copel|sabesp|sanepar|claro|vivo|tim\b|oi\b|internet|iptu|gas\b|g[aá]s/i,cat:'moradia'},
  {re:/renner|riachuelo|c&a|zara|shein|nike|adidas|centauro|calcad|cal[cç]ad/i,cat:'vest'},
  {re:/petz|cobasi|petshop|pet\s?shop|veterinari/i,cat:'pets'}
];
function suggestCat(desc){
  const lower=desc.toLowerCase();
  const rule=D.rules.find(r=>lower.includes(r.pattern.toLowerCase()));
  if(rule) return rule.catId;
  const k=KEYWORDS.find(k=>k.re.test(lower));
  return k?k.cat:'outros';
}
$('fileInput').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{try{processStatement(f.name,reader.result)}catch(e){toast('Não consegui ler este arquivo 😕');console.error(e)}};
  reader.readAsText(f,'ISO-8859-1');
  ev.target.value='';
});
function parseOFX(text){
  const out=[];
  const blocks=text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(b=>{
    const g=tag=>{const m=b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
    const amt=parseFloat((g('TRNAMT')||'').replace(',','.'));
    const dt=(g('DTPOSTED')||'').slice(0,8);
    if(!amt||dt.length<8) return;
    out.push({date:dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8),
      v:Math.abs(amt), neg:amt<0, desc:(g('MEMO')||g('NAME')||'Transação').replace(/\s+/g,' '),
      fitid:g('FITID')});
  });
  return out;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const out=[];
  lines.forEach(l=>{
    const cells=splitCSV(l,sep);
    if(cells.length<2) return;
    // achar data
    let date=null,vi=-1;
    cells.forEach((c)=>{
      let m=c.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m){date=m[1]+'-'+m[2]+'-'+m[3];return}
      m=c.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m){date=m[3]+'-'+m[2]+'-'+m[1]}
    });
    if(!date) return; // pula cabeçalho
    // valor: última célula numérica
    for(let i=cells.length-1;i>=0;i--){const v=parseMoney(cells[i]); if(v!==null&&cells[i].match(/\d/)&&!cells[i].match(/\d{4}-\d{2}|\/\d{4}/)){vi=i;break}}
    if(vi<0) return;
    const v=parseMoney(cells[vi]);
    const desc=cells.filter((c,i)=>i!==vi&&!c.match(/^\d{4}-\d{2}-\d{2}|^\d{2}\/\d{2}\/\d{4}/)).sort((a,b)=>b.length-a.length)[0]||'Transação';
    out.push({date,v:Math.abs(v),neg:v<0,desc:desc.replace(/^"|"$/g,'').replace(/\s+/g,' ').trim(),fitid:''});
  });
  return out;
}
function splitCSV(line,sep){
  const out=[];let cur='',q=false;
  for(const ch of line){
    if(ch==='"'){q=!q;continue}
    if(ch===sep&&!q){out.push(cur);cur='';continue}
    cur+=ch;
  }
  out.push(cur);return out.map(s=>s.trim());
}
function processStatement(name,text){
  const isOFX=/<OFX|<STMTTRN/i.test(text);
  let stmts=isOFX?parseOFX(text):parseCSV(text);
  // ignora créditos em extrato de cartão? mantém tudo que é débito/gasto + marca receitas
  if(!stmts.length){toast('Nenhuma transação reconhecida no arquivo 😕');return}
  const matched=[],news=[];let dupes=0;
  const usedTx=new Set();
  // extrato de conta tem débitos E créditos; fatura de cartão só tem valores de um sinal.
  const hasNeg=stmts.some(s=>s.neg)&&stmts.some(s=>!s.neg);
  stmts.forEach(s=>{s.isInc=hasNeg&&!s.neg});
  stmts.forEach(s=>{
    const hash=s.fitid||s.date+'|'+s.v+'|'+s.desc.slice(0,18);
    if(D.txs.some(t=>t.hash===hash)){dupes++;return}
    // match: mesmo valor, data ±3 dias, ainda não conciliado
    const sd=new Date(s.date).getTime();
    const wantType=s.isInc?'inc':'exp';
    const m=D.txs.find(t=>!t.conc&&!usedTx.has(t.id)&&t.type===wantType&&Math.abs(t.v-s.v)<0.005&&Math.abs(new Date(t.date).getTime()-sd)<=3*864e5);
    if(m){usedTx.add(m.id);matched.push({stmt:{...s,hash},tx:m})}
    else news.push({...s,hash,sug:s.isInc?'salario':suggestCat(s.desc),done:false});
  });
  // "só no app": lançamentos do período do arquivo sem conciliação
  const dates=stmts.map(s=>s.date).sort();
  const from=dates[0],to=dates[dates.length-1];
  const matchedIds=new Set(matched.map(m=>m.tx.id));
  const onlyApp=D.txs.filter(t=>t.type==='exp'&&!t.conc&&!matchedIds.has(t.id)&&t.date>=from&&t.date<=to).slice(0,8);
  // aplica conciliações imediatamente
  matched.forEach(m=>{m.tx.conc=true;m.tx.hash=m.stmt.hash});
  save();
  pendingImport={name,matched,news,onlyApp,dupes};
  screen='conc';render();
  toast(`📄 ${stmts.length} transações lidas · ${matched.length} conciliadas`);
}
function acceptNew(i){
  const m=pendingImport.news[i];
  const cid=$('sel_'+i)?$('sel_'+i).value:m.sug;
  // aprender regra se o usuário escolheu manualmente uma categoria diferente da sugestão por palavra-chave
  const key=m.desc.split(/\s+/).slice(0,2).join(' ');
  if(!m.isInc&&!D.rules.some(r=>r.pattern.toLowerCase()===key.toLowerCase())&&cid!=='outros') D.rules.push({pattern:key,catId:cid});
  D.txs.push({id:uid(),date:m.date,desc:capitalize(m.desc),cat:cid,v:m.v,type:m.isInc?'inc':'exp',who:personFilter!=='all'?personFilter:D.people[0].id,pay:'Importado',conc:true,origin:'importado',hash:m.hash});
  m.done=true; save(); render(); toast('✅ Importado');
}
function acceptAll(){pendingImport.news.forEach((m,i)=>{if(!m.done)acceptNew(i)})}
function finishImport(){pendingImport=null;render()}
function capitalize(s){s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- exportações ---------- */
function download(name,content,mime){
  const blob=new Blob(["﻿"+content],{type:(mime||'text/csv')+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function exportCSV(){
  const head='Data;Descrição;Categoria;Tipo;Valor;Pessoa;Pagamento;Conciliado;Origem;Parcela';
  const rows=D.txs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[
    t.date,csvSafe(t.desc||cat(t.cat).n),csvSafe(cat(t.cat).n),t.type==='inc'?'Receita':'Despesa',
    String(t.v.toFixed(2)).replace('.',','),csvSafe(person(t.who).n),csvSafe(t.pay||''),t.conc?'Sim':'Não',t.origin||'manual',t.parcela||''
  ].join(';'));
  download('finansfamilia_lancamentos.csv',[head,...rows].join('\n'));
  toast('⬇️ CSV exportado — abra no Excel ou importe no Google Sheets');
}
function exportResumoCSV(){
  const months={};
  D.txs.forEach(t=>{const mk=monthKey(t.date);months[mk]=months[mk]||{inc:0,exp:0,cats:{}};
    if(t.type==='inc')months[mk].inc+=t.v;else{months[mk].exp+=t.v;months[mk].cats[t.cat]=(months[mk].cats[t.cat]||0)+t.v}});
  const catIds=D.cats.filter(c=>!c.income).map(c=>c.id);
  const head=['Mês','Receitas','Despesas','Saldo',...catIds.map(id=>csvSafe(cat(id).n))].join(';');
  const rows=Object.keys(months).sort().map(mk=>{const m=months[mk];
    return [mk,num(m.inc),num(m.exp),num(m.inc-m.exp),...catIds.map(id=>num(m.cats[id]||0))].join(';')});
  download('finansfamilia_resumo_mensal.csv',[head,...rows].join('\n'));
  toast('⬇️ Resumo mensal exportado');
}
function num(v){return String(v.toFixed(2)).replace('.',',')}
function csvSafe(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function backupJSON(){download('finansfamilia_backup_'+todayISO()+'.json',JSON.stringify(D,null,1),'application/json');toast('💾 Backup gerado')}
$('restoreInput').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.txs||!d.people)throw 0;D=d;save();render();toast('📥 Backup restaurado!')}catch(e){toast('Arquivo de backup inválido 😕')}};
  r.readAsText(f);ev.target.value='';
});

/* ---------- configurações ---------- */
function renamePerson(i,name){name=name.trim();if(!name)return;D.people[i].n=name;save();toast('✏️ Nome atualizado')}
function setBudget(cid,v){const n=parseMoney(v);if(n===null||n<=0){delete D.budgets[cid]}else{D.budgets[cid]=n}save();render()}
function wipeAll(){
  if(!confirmWipe){confirmWipe=true;toast('Toque de novo para confirmar a exclusão de TUDO ⚠️');setTimeout(()=>confirmWipe=false,4000);return}
  D=defaultData();save();render();toast('🗑️ Dados apagados');
}
let confirmWipe=false;

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- boot ---------- */
load();
render();
</script>
